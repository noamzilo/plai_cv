[tool.poetry]
name = "plai-cv"
version = "0.1.0"
description = "Minimal Python env with OpenCV, NumPy, Matplotlib, and Pandas"
authors = ["Noam"]
package-mode = false 

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
matplotlib = "^3.8"
pandas = "^2.2"
ultralytics = "^8.3.144"
scipy = "^1.15.3"
filterpy = "^1.4.5"
pyqt5 = "^5.15.11"
mpld3 = "^0.5.10"
openpyxl = "^3.1.5"
plotly = "^6.1.2"
opencv-python-headless = "^4.11.0.86"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
